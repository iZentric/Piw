name: FS22 to FS25 mod helper

# Helper workflow used to move the mod .zip files from Google Drive into this
# repository (the sandbox machine has no direct internet access to Drive) and to
# build the converted FS25 mods.
#
#   mode "extract": downloads the mods and commits only the small text files
#                   (xml / i3d / lua / txt) so they can be inspected and edited.
#   mode "apply":   downloads the mods again, applies everything from
#                   transfer/patched/ on top of them, and attaches the final
#                   FS25 mods to a GitHub release.
#
# The mode is picked automatically: if transfer/patched/ contains files -> apply.

on:
  push:
    branches:
      - arena/01a10279-piw
    paths:
      - '.github/workflows/mod-convert.yml'
      - 'transfer/request/**'
      - 'transfer/patched/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mod-convert
  cancel-in-progress: false

env:
  DRIVE_FOLDER: 'https://drive.google.com/drive/folders/1cTvQysO6Tu-vnGkug8NUTQfBQW44uAAm'

jobs:
  helper:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install tools
        run: |
          python -m pip install --quiet --upgrade pip gdown
          sudo apt-get -qq update
          sudo apt-get -qq install -y unzip zip

      - name: Detect mode
        id: mode
        run: |
          if [ -d transfer/patched ] && [ -n "$(find transfer/patched -type f -print -quit)" ]; then
            echo "mode=apply" >> "$GITHUB_OUTPUT"
          else
            echo "mode=extract" >> "$GITHUB_OUTPUT"
          fi
          cat "$GITHUB_OUTPUT"

      - name: Download mods from Google Drive
        run: |
          mkdir -p /tmp/downloads
          set +e
          gdown --folder "$DRIVE_FOLDER" -O /tmp/downloads --remaining-ok
          rc=$?
          set -e
          if [ "$rc" -ne 0 ] || [ -z "$(find /tmp/downloads -name '*.zip' -print -quit)" ]; then
            echo "gdown failed (rc=$rc) - using fallback downloader"
            python3 tools/drive_fallback.py "$DRIVE_FOLDER" /tmp/downloads
          fi
          find /tmp/downloads -type f -printf '%10s  %p\n' | sort -k2
          test -n "$(find /tmp/downloads -name '*.zip' -print -quit)"
          sha256sum $(find /tmp/downloads -name '*.zip' | sort) | tee /tmp/checksums.txt

      - name: Extract conversion-relevant text files
        if: steps.mode.outputs.mode == 'extract'
        run: |
          python3 tools/extract_text.py /tmp/downloads transfer/original
          find transfer/original -type f | head -80
          du -sh transfer/original

      - name: Commit extracted files
        if: steps.mode.outputs.mode == 'extract'
        run: |
          git config user.name "piw-mod-helper"
          git config user.email "piw-mod-helper@users.noreply.github.com"
          git add -f transfer/original
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "transfer: extract mod text files [skip ci]"
          git push origin "HEAD:${{ github.ref_name }}"

      - name: Apply patches and build converted mods
        if: steps.mode.outputs.mode == 'apply'
        run: |
          python3 tools/apply_patches.py /tmp/downloads transfer/patched dist
          ls -la dist
          du -sh dist

      - name: Publish converted mods as release assets
        if: steps.mode.outputs.mode == 'apply'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view fs25-converted >/dev/null 2>&1; then
            gh release create fs25-converted --title "FS25 converted mods" --notes "FS22 mods converted for Farming Simulator 25 (generated automatically)."
          fi
          for f in dist/*.zip; do
            gh release upload fs25-converted "$f" --clobber
          done
          gh release view fs25-converted
