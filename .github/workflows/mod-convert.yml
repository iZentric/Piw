name: FS22 to FS25 mod helper

# Helper used to move the mod .zip files from Google Drive into this repository
# (the sandbox machine cannot reach Drive) and to build the converted FS25 mods.
#
#   mode "extract": download the mods, commit only the small text files
#                   (xml / i3d / lua / txt) so they can be inspected and edited.
#   mode "apply":   download the mods again, apply everything from
#                   transfer/patched/ on top of them and publish the finished
#                   FS25 mods as release assets.
#
# The mode is picked automatically: if transfer/patched/ has files -> apply.
# All console output of the helper steps is written into the repository
# (transfer/original/_download_log.txt, transfer/reference/_*_log.txt,
# transfer/patched/_apply_log.txt) because run logs are not readable elsewhere.

on:
  push:
    branches:
      - arena/01a10279-piw
    paths:
      - '.github/workflows/mod-convert.yml'
      - 'transfer/request/**'
      - 'transfer/patched/**'
      - 'tools/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mod-convert
  cancel-in-progress: false

env:
  DRIVE_FOLDER: 'https://drive.google.com/drive/folders/1cTvQysO6Tu-vnGkug8NUTQfBQW44uAAm'
  EXPECTED: 'FS22_DT_Pack.zip FS22_T150_Gus.zip'
  BRANCH: 'arena/01a10279-piw'

jobs:
  helper:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install tools
        run: |
          python -m pip install --quiet --upgrade pip gdown
          sudo apt-get -qq update
          sudo apt-get -qq install -y unzip zip

      - name: Detect mode
        id: mode
        run: |
          if [ -d transfer/patched ] && [ -n "$(find transfer/patched -type f -print -quit)" ]; then
            echo "mode=apply" >> "$GITHUB_OUTPUT"
          else
            echo "mode=extract" >> "$GITHUB_OUTPUT"
          fi
          cat "$GITHUB_OUTPUT"

      - name: Download mods from Google Drive
        run: |
          LOG="$RUNNER_TEMP/download.log"
          : > "$LOG"
          mkdir -p /tmp/downloads
          echo "=== gdown --folder ===" | tee -a "$LOG"
          set +e
          gdown --folder "$DRIVE_FOLDER" -O /tmp/downloads 2>&1 | tee -a "$LOG"
          set -e

          find /tmp/downloads -mindepth 2 -name '*.zip' -exec mv -n {} /tmp/downloads/ \; 2>/dev/null || true
          echo "=== after gdown ===" | tee -a "$LOG"
          find /tmp/downloads -type f -printf '%10s  %p\n' | sort -k2 | tee -a "$LOG"

          NEED=""
          for f in $EXPECTED; do
            [ -f "/tmp/downloads/$f" ] || NEED="$NEED $f"
          done
          echo "=== missing after gdown:$NEED ===" | tee -a "$LOG"

          echo "=== python fallback ===" | tee -a "$LOG"
          set +e
          python3 tools/drive_fallback.py "$DRIVE_FOLDER" /tmp/downloads --log "$LOG" --need $NEED 2>&1 | tee -a "$LOG"
          set -e

          find /tmp/downloads -type f -printf '%10s  %p\n' | sort -k2 | tee -a "$LOG"
          sha256sum /tmp/downloads/*.zip | tee -a "$LOG"

          mkdir -p transfer/original
          cp "$LOG" transfer/original/_download_log.txt

          for f in $EXPECTED; do
            if [ ! -f "/tmp/downloads/$f" ]; then
              echo "::error::missing $f after all download attempts"
              exit 1
            fi
          done

      - name: Fetch reference pages / files
        if: hashFiles('transfer/request/reference_urls.txt') != ''
        run: |
          mkdir -p transfer/reference
          set +e
          python3 tools/fetch_urls.py transfer/request/reference_urls.txt transfer/reference 2>&1 \
            | tee transfer/reference/_fetch_log.txt
          set -e

      - name: Grab files from web hosts
        if: hashFiles('transfer/request/grab_urls.txt') != ''
        run: |
          mkdir -p transfer/reference/files
          set +e
          python3 tools/grab_file.py transfer/request/grab_urls.txt transfer/reference/files 2>&1 \
            | tee transfer/reference/_grab_log.txt
          set -e

      - name: Commit reference data
        if: hashFiles('transfer/request/reference_urls.txt') != '' || hashFiles('transfer/request/grab_urls.txt') != ''
        run: bash tools/commit_push.sh "$BRANCH" "transfer: reference data [skip ci]" transfer/reference

      - name: Extract conversion-relevant text files
        if: steps.mode.outputs.mode == 'extract'
        run: |
          python3 tools/extract_text.py /tmp/downloads transfer/original
          find transfer/original -type f | head -80
          du -sh transfer/original

      - name: Commit extracted files
        if: steps.mode.outputs.mode == 'extract'
        run: bash tools/commit_push.sh "$BRANCH" "transfer: extract mod text files [skip ci]" transfer/original

      - name: Apply patches and build converted mods
        if: steps.mode.outputs.mode == 'apply'
        run: |
          mkdir -p transfer/patched
          set +e
          python3 tools/apply_patches.py /tmp/downloads transfer/patched dist > "$RUNNER_TEMP/apply.log" 2>&1
          set -e
          cp "$RUNNER_TEMP/apply.log" transfer/patched/_apply_log.txt
          cat "$RUNNER_TEMP/apply.log"
          ls -la dist

      - name: Publish converted mods as release assets
        if: steps.mode.outputs.mode == 'apply'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          test -n "$(find dist -name '*.zip' -print -quit)"
          if ! gh release view fs25-converted >/dev/null 2>&1; then
            gh release create fs25-converted --title "FS25 converted mods" --notes "FS22 mods converted for Farming Simulator 25 (generated automatically)."
          fi
          for f in dist/*.zip; do
            gh release upload fs25-converted "$f" --clobber
          done
          gh release view fs25-converted

      - name: Commit apply log
        if: steps.mode.outputs.mode == 'apply'
        run: bash tools/commit_push.sh "$BRANCH" "transfer: apply log [skip ci]" transfer/patched/_apply_log.txt
